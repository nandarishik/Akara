{% extends "_frame.html" %}
{% block title %}Team invite — {{ tenant_name }}{% endblock %}
{% block content %}
<h2 style="margin-top:0;">You've been invited to {{ tenant_name }}</h2>
<p>Join your team on AKARA to collaborate on sales insights and weekly debriefs.</p>
<p><a href="{{ invite_url }}" style="display:inline-block;background:#2150f3;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;font-weight:bold;">Accept invitation →</a></p>
<p style="color:#6b7280;font-size:13px;">This link expires in 7 days.</p>
{% endblock %}
