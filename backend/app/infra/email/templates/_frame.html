<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}AKARA{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f9;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background:#0a1f3d;color:#ffffff;padding:20px 24px;font-size:18px;font-weight:bold;">
              AKARA
            </td>
          </tr>
          <tr>
            <td style="padding:24px;color:#1a1a2e;font-size:15px;line-height:1.5;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background:#f8f9fb;color:#6b7280;font-size:12px;">
              {% block footer %}
              <p style="margin:0;">— AKARA Team · Indian FMCG intelligence</p>
              {% if unsubscribe_url %}
              <p style="margin:8px 0 0;"><a href="{{ unsubscribe_url }}" style="color:#6b7280;">Unsubscribe</a></p>
              {% endif %}
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
