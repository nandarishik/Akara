[project]
name = "akara-universal-smb-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "faker>=24.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
generate-benchmark = "generator.__main__:main"
run-benchmark = "harness.run_benchmark:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
