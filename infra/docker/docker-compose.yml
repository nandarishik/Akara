services:
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../../backend/.env
  import-worker:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.worker
    env_file:
      - ../../backend/.env
    environment:
      WORKER_MODE: continuous
