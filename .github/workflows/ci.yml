name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Lint imports
        working-directory: backend
        run: uv run lint-imports

      - name: Check OpenAPI spec is committed
        working-directory: backend
        run: |
          uv run python -c "
          import json
          from app.main import app
          spec = app.openapi()
          with open('../docs/openapi.json') as f:
              committed = json.load(f)
          assert spec == committed, 'OpenAPI spec has changed. Regenerate docs/openapi.json and commit.'
          "

      - name: Run tests with coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENVIRONMENT: ci
          LOG_LEVEL: WARNING
        run: uv run pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  frontend-unit:
    name: Frontend — Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Vitest unit tests
        run: pnpm test --run

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: pnpm build

  e2e:
    name: Frontend — E2E
    if: github.event_name == 'pull_request'
    needs: [frontend-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build for E2E
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: pnpm build

      - name: Run Playwright smoke tests
        run: |
          pnpm preview --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          E2E_STAGING_URL=http://127.0.0.1:5173 pnpm exec playwright test

  migrations:
    name: Migrations — Convention Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify migration naming and sequence
        run: |
          cd supabase/migrations
          shopt -s nullglob
          files=(*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files found"
            exit 1
          fi
          expected=1
          for f in $(ls -1 *.sql | sort); do
            num=$(echo "$f" | sed 's/_.*//')
            if ! echo "$num" | grep -qE '^[0-9]{3}$'; then
              echo "Invalid migration name (expected NNN_description.sql): $f"
              exit 1
            fi
            num_int=$((10#$num))
            if [ "$num_int" -ne "$expected" ]; then
              echo "Migration sequence gap: expected $(printf '%03d' $expected), found $f"
              exit 1
            fi
            expected=$((expected + 1))
          done
          echo "Migration sequence OK (${#files[@]} files, 001–$(printf '%03d' $((expected - 1))))"
          for f in $(ls -1 *.sql | sort); do
            num=$(echo "$f" | sed 's/_.*//')
            num_int=$((10#$num))
            if [ "$num_int" -ge 29 ]; then
              rb="rollback/${num}_rollback.sql"
              if [ ! -f "$rb" ]; then
                echo "Missing rollback companion for $f (expected $rb)"
                exit 1
              fi
            fi
          done
          echo "Rollback check OK (required for migrations >= 029)"

  security-static:
    name: Security static (L1–L4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Bandit
        run: uv run bandit -r app/ -ll --skip B104,B608
      - name: Safety
        continue-on-error: true
        run: uv run safety check
      - name: Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep
        continue-on-error: true
        run: |
          pip install semgrep
          semgrep --config auto --severity ERROR --error || true

  security-dast:
    name: Security DAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect API path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'backend/app/api/**'
              - 'backend/app/main.py'
      - name: DAST placeholder
        if: steps.filter.outputs.api == 'true'
        continue-on-error: true
        run: echo "DAST (ZAP/swazz) unverified — tools not installed in this runner"

  security-container:
    name: Security container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect container path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - '**/Dockerfile*'
              - '**/*.dockerfile'
              - 'backend/deploy/**'
      - name: Container scan placeholder
        if: steps.filter.outputs.docker == 'true'
        continue-on-error: true
        run: echo "Container scan unverified — no Dockerfile in tree"

  env-isolation-check:
    name: Env isolation (E-01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail if akara-production appears in tracked source
        run: |
          set +e
          git grep -n "akara-production" -- \
            '*.yml' '*.yaml' '*.py' '*.ts' '*.tsx' '*.env.example' '.env.example' \
            ':!.github/workflows/ci.yml' \
            ':!docs/akara-phases' ':!phase_plans' ':!Akara_futureplan.md' \
            ':!docs/akara-dev-plans' ':!*.md'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "E-01: akara-production found in tracked files"
            exit 1
          fi
          echo "E-01 OK — no akara-production in owned tracked files"

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, migrations, env-isolation-check, security-static]
    runs-on: ubuntu-latest
    environment: staging
    env:
      WHATSAPP_SENDS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Block live Razorpay keys in staging
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        run: |
          if [ -n "$RAZORPAY_KEY_ID" ] && [[ "$RAZORPAY_KEY_ID" == rzp_live_* ]]; then
            echo "staging must not use rzp_live_ Razorpay keys"
            exit 1
          fi
      - name: Apply migrations
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "PARTIAL: supabase db push skipped — secrets not configured"
            exit 0
          fi
          npx supabase db push --project-ref "$SUPABASE_PROJECT_ID"
      - name: Smoke /health and /ready
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          if [ -z "$STAGING_API_URL" ]; then
            echo "PARTIAL: STAGING_API_URL not configured"
            exit 0
          fi
          curl -f "$STAGING_API_URL/health"
          curl -f "$STAGING_API_URL/ready"
      - name: Record deployment_events
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "PARTIAL: deployment_events insert skipped"
            exit 0
          fi
          curl -sS -X POST "$SUPABASE_URL/rest/v1/deployment_events" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"environment\":\"staging\",\"event_type\":\"deploy\",\"git_sha\":\"${GITHUB_SHA}\",\"actor\":\"github-actions\",\"service_name\":\"akara-api\",\"status\":\"succeeded\",\"metadata\":{}}"

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend, migrations, env-isolation-check, security-static]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Smoke /health
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          if [ -z "$PRODUCTION_API_URL" ]; then
            echo "PARTIAL: PRODUCTION_API_URL not configured"
            exit 0
          fi
          curl -f "$PRODUCTION_API_URL/health"
      - name: Record deployment_events
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "PARTIAL: deployment_events insert skipped"
            exit 0
          fi
          curl -sS -X POST "$SUPABASE_URL/rest/v1/deployment_events" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"environment\":\"production\",\"event_type\":\"deploy\",\"git_sha\":\"${GITHUB_SHA}\",\"actor\":\"github-actions\",\"service_name\":\"akara-api\",\"status\":\"succeeded\",\"metadata\":{}}"
